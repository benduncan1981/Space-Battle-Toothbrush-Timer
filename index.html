<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Plaque Invaders: Crystal Sector – Ultra Edition</title>
    <style>
        :root { --gold: #ffcc00; --rebel: #ff3333; --empire: #33ff33; --sky: #00f2ff; --bg: #000205; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; outline: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: 'Arial Black', sans-serif; color: white; touch-action: none; }
        
        .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 40px; text-align: center; background: radial-gradient(circle at center, #1a1a2e 0%, #000 100%); z-index: 10; height: 100dvh; touch-action: none; }
        .screen.active { display: flex; }

        h1 { font-size: 2.5rem; margin: 0; color: var(--gold); text-shadow: 0 0 20px var(--gold); font-style: italic; text-transform: uppercase; letter-spacing: -2px; }

        /* FIX: High-priority button styles for Safari/Edge touch */
        .btn-ui { 
            background: #fff; border: none; color: #000; padding: 22px; font-size: 1.1rem; border-radius: 50px; font-weight: 900; 
            text-transform: uppercase; width: 100%; max-width: 280px; box-shadow: 0 6px 0 #999; margin: 12px 0; 
            display: block; cursor: pointer; pointer-events: auto !important; position: relative; z-index: 5000; touch-action: manipulation;
        }
        .btn-ui:active { transform: translateY(4px); box-shadow: 0 2px 0 #666; background: var(--gold); }
        .btn-alt { background: rgba(255,255,255,0.1); border: 2px solid white; color: white; box-shadow: none; }

        #hud { position: absolute; top: 50px; left: 0; width: 100%; padding: 0 25px; display: flex; justify-content: space-between; z-index: 50; pointer-events: none; }
        #timer { font-size: 2.8rem; font-weight: 900; color: #fff; font-family: monospace; }
        
        .game-controls { position: absolute; bottom: 40px; left: 0; width: 100%; padding: 0 25px; display: flex; justify-content: space-between; z-index: 5000; pointer-events: none; }
        .ctrl-node { width: 70px; height: 70px; border-radius: 50%; background: rgba(255,255,255,0.25); border: 2px solid #fff; color: #fff; font-weight: 900; font-size: 0.7rem; display: flex; align-items: center; justify-content: center; pointer-events: auto !important; backdrop-filter: blur(5px); touch-action: manipulation; cursor: pointer; }

        #boss-hud { position: absolute; top: 120px; left: 50%; transform: translateX(-50%); width: 75%; display: none; z-index: 50; }
        .hp-track { width: 100%; height: 12px; background: #300; border-radius: 6px; border: 2px solid #f00; overflow: hidden; margin-top: 5px; }
        #hp-current { width: 100%; height: 100%; background: #f00; }

        canvas { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
        #shop-scroll { width: 100%; flex-grow: 1; overflow-y: auto; margin: 20px 0; -webkit-overflow-scrolling: touch; }
    </style>
</head>
<body>

    <div id="scr-menu" class="screen active">
        <h1>PLAQUE<br>INVADERS</h1>
        <div style="margin: 15px 0; color: var(--sky);">💎 <span id="stat-c">0</span> | STREAK: <span id="stat-s">0</span></div>
        <div class="btn-ui" id="trigger-start">ENGAGE MISSION</div>
        <div class="btn-ui btn-alt" id="trigger-shop">HANGAR</div>
    </div>

    <div id="scr-game" class="screen" style="background:transparent; padding:0;">
        <div id="hud">
            <div id="timer">02:00</div>
            <div style="color:var(--gold); font-weight:900;">💎 <span id="game-c">0</span></div>
        </div>
        <div id="boss-hud">
            <div style="color:red; font-size:0.7rem; font-weight:900;">CORE TARGET: DEATH STAR</div>
            <div class="hp-track"><div id="hp-current"></div></div>
        </div>
        <div class="game-controls">
            <div class="ctrl-node" id="trigger-pause">PAUSE</div>
            <div class="ctrl-node" id="trigger-quit" style="border-color:var(--rebel)">QUIT</div>
        </div>
        <canvas id="stage"></canvas>
    </div>

    <div id="scr-hangar" class="screen">
        <h1>HANGAR</h1>
        <div id="shop-scroll"></div>
        <div class="btn-ui" id="trigger-hangar-back">RETURN</div>
    </div>

    <div id="scr-loot" class="screen">
        <h1>SECTOR CLEAR</h1>
        <div id="reward-crate" style="font-size:7rem; margin:30px 0; filter: drop-shadow(0 0 20px gold); cursor:pointer;">📦</div>
        <div id="loot-label">Tap to claim salvage!</div>
        <div class="btn-ui" id="trigger-done" style="display:none">CONTINUE</div>
    </div>

<script>
const gState = { crystals: 0, streak: 0, active: false, paused: false, time: 120, selected: "ship_xwing", owned: ["ship_xwing"] };
const SHIPS = [
    { id: "ship_xwing", name: "Red 5 X-Wing", cost: 0, color: "#fff", laser: "#ff3333" },
    { id: "ship_falcon", name: "Millennium", cost: 200, color: "#ccc", laser: "#00f2ff" }
];

const canvas = document.getElementById('stage'), ctx = canvas.getContext('2d');
let entities = [], stars = [], boss = null, lastFire = 0, lastSpawn = 0, frameId = 0;
let pilot = { x: 0, targetX: 0, moveTime: 0 };

const AudioFX = (() => {
    let audioCtx = null;
    const play = (f,t,d,v,r=0) => { if(!audioCtx)return; const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.type=t; o.frequency.setValueAtTime(f,audioCtx.currentTime); if(r)o.frequency.exponentialRampToValueAtTime(r,audioCtx.currentTime+d); g.gain.setValueAtTime(v,audioCtx.currentTime); g.gain.linearRampToValueAtTime(0,audioCtx.currentTime+d); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+d); };
    return {
        unlock: () => { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); },
        laser: () => play(800,'sawtooth',0.1,0.03,100),
        boom: () => play(100,'triangle',0.5,0.1,20),
        win: () => [523, 659, 783, 1046].forEach((f,i)=>setTimeout(()=>play(f,'sine',0.4,0.05),i*150))
    };
})();

/** FIX: Universal Touch/Click Handler for Safari & Edge **/
function bind(id, action) {
    const el = document.getElementById(id);
    if (!el) return;
    const safeExecute = (e) => {
        if (e) { e.preventDefault(); e.stopPropagation(); }
        AudioFX.unlock();
        action();
    };
    el.addEventListener('touchstart', safeExecute, { passive: false });
    el.addEventListener('click', (e) => { if (e.pointerType !== 'touch') safeExecute(e); });
}

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; pilot.x = pilot.targetX = canvas.width / 2; }
window.addEventListener('resize', resize); resize();

function spawn() {
    const elap = 120 - gState.time;
    if(elap > 90) return;
    const big = elap > 45;
    entities.push({ type: big?'d':'t', x: Math.random()*(canvas.width-80)+40, y:-100, w:big?110:40, h:big?160:30, hp:big?18:1, speed:big?1.3:5, f:0 });
}

function loop(t) {
    if(!gState.active || gState.paused) return;
    ctx.fillStyle = "#000205"; ctx.fillRect(0,0,canvas.width,canvas.height);

    stars.forEach(s => { s.y += s.z * 2.5; if(s.y > canvas.height) s.y = 0; ctx.fillStyle=`rgba(255,255,255,${s.z/4})`; ctx.fillRect(s.x,s.y,s.z/2,s.z/2); });
    
    gState.time -= 1/60;
    document.getElementById('timer').innerText = `${Math.floor(gState.time/60)}:${Math.floor(gState.time%60).toString().padStart(2,'0')}`;

    if (t > pilot.moveTime) { pilot.targetX = 60 + Math.random() * (canvas.width - 120); pilot.moveTime = t + 600 + Math.random() * 1000; }
    pilot.x += (pilot.targetX - pilot.x) * 0.05;

    if(t - lastSpawn > (gState.time > 90 ? 800 : 1600)) { spawn(); lastSpawn = t; }
    if(t - lastFire > 200) { entities.push({type:'l', x:pilot.x, y:canvas.height-110, speed:-16}); AudioFX.laser(); lastFire = t; }

    if(gState.time < 30 && !boss) { boss = { x:canvas.width/2, y:-200, r:160, hp:500, max:500, f:0 }; document.getElementById('boss-hud').style.display='block'; }
    if(boss) {
        if(boss.y < 220) boss.y += 0.8; boss.x = canvas.width/2 + Math.sin(t/1200)*70;
        ctx.fillStyle = boss.f > 0 ? '#fff' : '#444'; if(boss.f > 0) boss.f--;
        ctx.beginPath(); ctx.arc(boss.x, boss.y, boss.r, 0, 7); ctx.fill();
        ctx.fillStyle="#222"; ctx.beginPath(); ctx.arc(boss.x-50, boss.y-50, 45, 0, 7); ctx.fill();
        document.getElementById('hp-current').style.width = (boss.hp/boss.max*100) + "%";
    }

    for(let i=entities.length-1; i>=0; i--) {
        const e = entities[i]; e.y += e.speed || 0;
        if(e.type === 'l') {
            const ship = SHIPS.find(s=>s.id===gState.selected);
            ctx.fillStyle = ship.laser; ctx.fillRect(e.x-2, e.y, 4, 25);
            if(boss && Math.hypot(e.x-boss.x, e.y-boss.y) < boss.r) { boss.hp--; boss.f=3; entities.splice(i,1); continue; }
            entities.forEach((en, j) => {
                if(en.type !== 'l' && Math.abs(e.x-en.x) < en.w/2 && Math.abs(e.y-en.y) < en.h/2) {
                    en.hp--; en.f=3; entities.splice(i,1);
                    if(en.hp<=0) { AudioFX.boom(); entities.splice(j,1); gState.crystals+=5; document.getElementById('game-c').innerText = gState.crystals; }
                }
            });
        } else {
            ctx.fillStyle = e.f > 0 ? "#fff" : (e.type==='t'?'#777':'#999');
            if(e.type==='t') { ctx.fillRect(e.x-e.w/2, e.y-e.h/2, 4, e.h); ctx.fillRect(e.x+e.w/2-4, e.y-e.h/2, 4, e.h); ctx.fillRect(e.x-e.w/2, e.y-2, e.w, 4); }
            else { ctx.beginPath(); ctx.moveTo(e.x, e.y+e.h/2); ctx.lineTo(e.x-e.w/2, e.y-e.h/2); ctx.lineTo(e.x+e.w/2, e.y-e.h/2); ctx.fill(); }
            if(e.f > 0) e.f--;
        }
        if(e.y > canvas.height+200 || e.y < -300) entities.splice(i,1);
    }

    const ship = SHIPS.find(s=>s.id===gState.selected);
    ctx.fillStyle = ship.color; ctx.fillRect(pilot.x-4, canvas.height-130, 8, 45); ctx.fillRect(pilot.x-30, canvas.height-95, 60, 4);
    
    if(gState.time > 0) frameId = requestAnimationFrame(loop); else finish();
}

function nav(id) { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); if(id==='scr-menu'){document.getElementById('stat-c').innerText=gState.crystals; document.getElementById('stat-s').innerText=gState.streak;} }
function run() { gState.active=true; gState.paused=false; gState.time=120; entities=[]; boss=null; document.getElementById('game-c').innerText="0"; document.getElementById('boss-hud').style.display='none'; nav('scr-game'); stars=[]; for(let i=0; i<80; i++) stars.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, z:Math.random()*3+1}); loop(0); }
function finish() { gState.active=false; cancelAnimationFrame(frameId); nav('scr-loot'); document.getElementById('trigger-done').style.display='none'; document.getElementById('loot-label').innerText="Tap to claim salvage!"; }

// BINDINGS (Hard-coded IDs to match UI)
bind('trigger-start', run);
bind('trigger-shop', () => {
    const list = document.getElementById('shop-scroll'); list.innerHTML = "";
    SHIPS.forEach(s => {
        const d = document.createElement('div');
        d.style = "background:rgba(255,255,255,0.1); margin:10px 0; padding:18px; border-radius:12px; display:flex; justify-content:space-between; align-items:center;";
        d.innerHTML = `<div style="text-align:left"><b>${s.name}</b><br><small>${gState.owned.includes(s.id)?'OWNED':s.cost+' 💎'}</small></div>`;
        const b = document.createElement('div'); b.style="background:white; color:black; padding:10px; border-radius:8px; font-size:0.7rem; font-weight:900; cursor:pointer;";
        b.innerText = gState.selected===s.id?"EQUIPPED":(gState.owned.includes(s.id)?"SELECT":"BUY");
        b.onclick = () => { if(gState.owned.includes(s.id)){gState.selected=s.id;}else if(gState.crystals>=s.cost){gState.crystals-=s.cost; gState.owned.push(s.id); gState.selected=s.id;} localStorage.setItem('pi_vFinal', JSON.stringify(gState)); nav('scr-hangar'); };
        d.appendChild(b); list.appendChild(d);
    });
    nav('scr-hangar');
});
bind('trigger-hangar-back', () => nav('scr-menu'));
bind('trigger-pause', () => { gState.paused = !gState.paused; document.getElementById('trigger-pause').innerText = gState.paused?"RESUME":"PAUSE"; if(!gState.paused) loop(performance.now()); });
bind('trigger-quit', () => { gState.active=false; nav('scr-menu'); });
bind('reward-crate', () => { AudioFX.win(); gState.crystals+=150; gState.streak++; document.getElementById('loot-label').innerText="+150 CRYSTALS!"; document.getElementById('trigger-done').style.display='block'; localStorage.setItem('pi_vFinal', JSON.stringify(gState)); });
bind('trigger-done', () => nav('scr-menu'));

const data = localStorage.getItem('pi_vFinal'); if(data) Object.assign(gState, JSON.parse(data)); nav('scr-menu');
</script>
</body>
</html>
