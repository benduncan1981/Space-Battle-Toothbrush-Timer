<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Plaque Invaders: Ultra Stable Edition</title>
    <style>
        :root { --gold: #ffcc00; --rebel: #ff3333; --blue: #00f2ff; --bg: #000; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; color: #fff; touch-action: none; }
        .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; z-index: 10; height: 100svh; background: #000; }
        .screen.active { display: flex; }
        .btn { background: #fff; border: none; color: #000; padding: 20px 40px; font-size: 1.2rem; border-radius: 50px; font-weight: 900; text-transform: uppercase; margin: 10px; cursor: pointer; width: 260px; box-shadow: 0 5px 0 #999; position: relative; z-index: 500; }
        .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #666; }
        #hud { position: absolute; top: 40px; width: 100%; padding: 0 20px; display: flex; justify-content: space-between; pointer-events: none; z-index: 50; }
        #timer { font-size: 2.5rem; font-weight: 900; font-family: monospace; }
        #boss-bar { position: absolute; top: 100px; width: 70%; height: 10px; background: #300; border: 1px solid red; display: none; z-index: 50; }
        #boss-hp { width: 100%; height: 100%; background: red; transition: width 0.1s; }
        canvas { position: absolute; inset: 0; z-index: 1; image-rendering: pixelated; }
    </style>
</head>
<body>
    <div id="scr-menu" class="screen active">
        <h1 style="color:var(--gold); font-size:2.5rem; margin:0;">PLAQUE INVADERS</h1>
        <p style="color:var(--blue)">CRYSTALS: <span id="val-c">0</span> | STREAK: <span id="val-s">0</span></p>
        <div class="btn" id="btn-start">START MISSION</div>
        <div class="btn" id="btn-shop" style="background:none; color:#fff; border:1px solid #fff; box-shadow:none;">SHOP</div>
    </div>
    <div id="scr-game" class="screen" style="background:transparent; padding:0;">
        <div id="hud"><div id="timer">02:00</div><div id="g-c" style="color:var(--gold)">0 💎</div></div>
        <div id="boss-bar"><div id="boss-hp"></div></div>
        <canvas id="cvs"></canvas>
    </div>
    <div id="scr-loot" class="screen">
        <h1 style="color:var(--gold)">MISSION COMPLETE</h1>
        <div id="box" style="font-size:5rem; margin:20px; cursor:pointer;">📦</div>
        <p id="loot-txt">Tap the box!</p>
        <div class="btn" id="btn-done" style="display:none">CONTINUE</div>
    </div>

<script>
const state = { crys: 0, streak: 0, active: false, time: 120, hp: 100 };
const cvs = document.getElementById('cvs'), ctx = cvs.getContext('2d', { alpha: false });
let ents = [], stars = [], boss = null, frame = 0, lastS = 0, lastF = 0;
let pilot = { x: 0, tx: 0, mt: 0 };

const Sfx = {
    ctx: null,
    play(f, t, d, v) {
        if(!this.ctx) return;
        try {
            const o = this.ctx.createOscillator(), g = this.ctx.createGain();
            o.type = t; o.frequency.setValueAtTime(f, this.ctx.currentTime);
            g.gain.setValueAtTime(v, this.ctx.currentTime);
            g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + d);
            o.connect(g); g.connect(this.ctx.destination);
            o.start(); o.stop(this.ctx.currentTime + d);
        } catch(e) {}
    },
    boot() { 
        if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); 
        if(this.ctx.state === 'suspended') this.ctx.resume(); 
    }
};

function resize() {
    cvs.width = window.innerWidth; cvs.height = window.innerHeight;
    pilot.x = pilot.tx = cvs.width / 2;
    stars = [];
    for(let i=0; i<60; i++) stars.push({x: Math.random()*cvs.width, y: Math.random()*cvs.height, s: Math.random()*3+1});
}
window.onresize = resize; resize();

function loop(t) {
    if(!state.active) return;
    
    // Low-cost background clear
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, cvs.width, cvs.height);

    // Optimized Stars
    ctx.fillStyle = "#444";
    stars.forEach(s => {
        s.y += s.s * 2; if(s.y > cvs.height) s.y = 0;
        ctx.fillRect(s.x, s.y, 1, 1);
    });

    state.time -= 1/60;
    if(state.time <= 0) return win();
    document.getElementById('timer').innerText = `${Math.floor(state.time/60)}:${Math.floor(state.time%60).toString().padStart(2,'0')}`;

    // Pilot Logic
    if(t > pilot.mt) { pilot.tx = 50 + Math.random()*(cvs.width-100); pilot.mt = t + 1000; }
    pilot.x += (pilot.tx - pilot.x) * 0.05;

    // Entity Processing (Aggressive Cleanup)
    if(t - lastS > 1500 && state.time > 30) {
        ents.push({type:'e', x: Math.random()*cvs.width, y:-50, w:30, h:20, s:3, hp:1});
        lastS = t;
    }
    if(t - lastF > 250) {
        ents.push({type:'l', x: pilot.x, y: cvs.height-80, s:-12});
        Sfx.play(800, 'square', 0.1, 0.02);
        lastF = t;
    }

    if(state.time < 30 && !boss) {
        boss = {x: cvs.width/2, y:-100, hp:300, max:300};
        document.getElementById('boss-bar').style.display = 'block';
    }

    if(boss) {
        if(boss.y < 150) boss.y++;
        boss.x = cvs.width/2 + Math.sin(t/1000)*50;
        ctx.fillStyle = "#555"; ctx.beginPath(); ctx.arc(boss.x, boss.y, 60, 0, 7); ctx.fill();
        document.getElementById('boss-hp').style.width = (boss.hp/boss.max*100) + "%";
    }

    for(let i=ents.length-1; i>=0; i--) {
        const e = ents[i]; e.y += e.s;
        if(e.type === 'l') {
            ctx.fillStyle = "red"; ctx.fillRect(e.x-1, e.y, 2, 15);
            if(boss && Math.hypot(e.x-boss.x, e.y-boss.y) < 60) { boss.hp--; ents.splice(i,1); continue; }
            ents.forEach((en, j) => {
                if(en.type === 'e' && Math.hypot(e.x-en.x, e.y-en.y)  cvs.height + 100) ents.splice(i, 1);
    }

    // Hero
    ctx.fillStyle = "#fff"; ctx.fillRect(pilot.x-2, cvs.height-100, 4, 30);
    ctx.fillRect(pilot.x-20, cvs.height-80, 40, 4);

    frame = requestAnimationFrame(loop);
}

function win() {
    state.active = false; cancelAnimationFrame(frame);
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('scr-loot').classList.add('active');
    document.getElementById('btn-done').style.display = 'none';
}

function bind(id, cb) {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => { e.preventDefault(); Sfx.boot(); cb(); });
    el.addEventListener('click', (e) => { if(!('ontouchstart' in window)) { Sfx.boot(); cb(); } });
}

bind('btn-start', () => {
    state.active = true; state.time = 120; ents = []; boss = null;
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('scr-game').classList.add('active');
    requestAnimationFrame(loop);
});

bind('box', () => {
    Sfx.play(400, 'sine', 0.5, 0.1);
    state.crys += 100; state.streak++;
    document.getElementById('loot-txt').innerText = "+100 CRYSTALS CLAIMED!";
    document.getElementById('btn-done').style.display = 'block';
    localStorage.setItem('pi_ultra_stable', JSON.stringify({c:state.crys, s:state.streak}));
});

bind('btn-done', () => location.reload());

const save = localStorage.getItem('pi_ultra_stable');
if(save) { const d = JSON.parse(save); state.crys = d.c; state.streak = d.s; }
document.getElementById('val-c').innerText = state.crys;
document.getElementById('val-s').innerText = state.streak;
</script>
</body>
</html>
