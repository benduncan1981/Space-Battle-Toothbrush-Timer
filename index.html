<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Hyperspace Phases — Single File</title>
<style>
  :root{
    --bg:#0b0f1a; --ui:#ffffff; --warn:#ff9f1c; --danger:#ff3b3b;
    --banner-bg: rgba(0,0,0,0.6);
  }
  html,body{height:100%;margin:0;background:var(--bg);font-family:Inter,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial;}
  .wrap{display:flex;flex-direction:column;height:100%;align-items:center;justify-content:flex-start;padding:24px;box-sizing:border-box;}
  header{width:100%;display:flex;justify-content:center;margin-bottom:8px;}
  /* Timer: large, top-centre */
  #timer{color:var(--ui);font-weight:700;font-size:56px;line-height:1;text-align:center;min-width:160px;}
  /* Canvas area */
  .stage{flex:1;display:flex;align-items:center;justify-content:center;width:100%;max-width:1200px;position:relative;}
  canvas{background:linear-gradient(180deg,#071026 0%, #081426 100%);border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,0.6);display:block;}
  /* Announcement banner: centre */
  .banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:18px 28px;border-radius:8px;background:var(--banner-bg);backdrop-filter:blur(4px);display:flex;flex-direction:column;align-items:center;opacity:0;pointer-events:none;}
  .banner h1{margin:0;color:var(--ui);font-size:36px;text-align:center;}
  .banner p{margin:6px 0 0;color:#ddd;font-size:14px;text-align:center;}
  /* Controls (centered, spaced) */
  .controls{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:12px;}
  button{padding:10px 16px;border-radius:8px;border:0;background:#1f2937;color:#fff;font-weight:600;cursor:pointer;}
  button.secondary{background:#2b3440;}
  /* HUD elements anchored center-bottom */
  .hud{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:12px;align-items:center;}
  .pill{background:rgba(255,255,255,0.06);padding:8px 12px;border-radius:999px;color:#ddd;font-size:13px;}
  /* Debug overlay */
  .debug{position:absolute;left:12px;top:12px;color:#0f0;font-family:monospace;font-size:12px;opacity:0.9;}
  /* Responsive */
  @media (max-width:600px){#timer{font-size:36px;} .banner h1{font-size:22px;} canvas{width:100%;height:60vh;}}
</style>
</head>
<body>
<div class="wrap">
  <header><div id="timer" aria-live="polite">0:00</div></header>

  <main class="stage">
    <canvas id="game" width="1000" height="600"></canvas>

    <div class="banner" id="banner" role="status" aria-live="assertive">
      <h1 id="bannerMain">Prepare for hyperspace</h1>
      <p id="bannerSub"></p>
    </div>

    <div class="hud" id="hud">
      <div class="pill" id="phasePill">Phase 1</div>
      <div class="pill" id="zonePill">Zone 1</div>
    </div>

    <div class="debug" id="debug" style="display:none"></div>
  </main>

  <div class="controls">
    <button id="startBtn">Start</button>
    <button id="debugBtn" class="secondary">Toggle Debug</button>
    <button id="resetBtn" class="secondary">Reset</button>
  </div>
</div>

<script>
/* Single-file game implementing:
   - 5s pre-countdown
   - 120s main timer
   - Phase every 30s (90,60,30)
   - Hyperspace transitions at each boundary
   - Final 30s boss battle with visible damage states
   - Central UI, large timer, announcement banners
*/

/* -------------------------
   Config and state
   ------------------------- */
const CONFIG = {
  preCountdown: 5,
  mainTimer: 120,
  phaseLength: 30,
  canvasW: 1000,
  canvasH: 600,
  enemyPools: [
    // Zone 1 enemies (simple shapes)
    [{type:'triangle',color:'#7bd389',hp:6,speed:60},{type:'circle',color:'#4fc3f7',hp:4,speed:80}],
    // Zone 2
    [{type:'diamond',color:'#ffd166',hp:8,speed:70},{type:'circle',color:'#ff6b6b',hp:5,speed:90}],
    // Zone 3
    [{type:'hex',color:'#c084fc',hp:10,speed:85},{type:'triangle',color:'#60a5fa',hp:7,speed:100}],
    // Boss zone (enemies optional)
    [{type:'circle',color:'#f97316',hp:12,speed:110}]
  ],
  zoneBackgrounds: ['#071026','#0b1a2b','#1a0b26','#120b12'],
  zonePalettes: ['#7bd389','#ffd166','#c084fc','#ff6b6b'],
  spawnBaseRate: 0.9 // enemies per second baseline
};

let state = {
  running:false,
  preCounting:false,
  timer:CONFIG.mainTimer,
  phaseIndex:0, // 0..3 (3 is boss)
  zoneIndex:0,
  boss:null,
  enemies:[],
  projectiles:[],
  lastSpawn:0,
  lastTime:0,
  bannerTimeout:null,
  debug:false
};

/* -------------------------
   DOM references
   ------------------------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = CONFIG.canvasW; canvas.height = CONFIG.canvasH;
const timerEl = document.getElementById('timer');
const banner = document.getElementById('banner');
const bannerMain = document.getElementById('bannerMain');
const bannerSub = document.getElementById('bannerSub');
const phasePill = document.getElementById('phasePill');
const zonePill = document.getElementById('zonePill');
const debugEl = document.getElementById('debug');
const startBtn = document.getElementById('startBtn');
const resetBtn = document.getElementById('resetBtn');
const debugBtn = document.getElementById('debugBtn');

/* -------------------------
   Utilities
   ------------------------- */
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function rand(min,max){return Math.random()*(max-min)+min;}
function formatTime(s){s = Math.max(0,Math.ceil(s)); const m = Math.floor(s/60); const sec = s%60; return `${m}:${sec.toString().padStart(2,'0')}`;}

/* -------------------------
   Announcement Banner (reusable)
   ------------------------- */
function showBanner(text, sub='', duration=1200, style='phase'){
  clearTimeout(state.bannerTimeout);
  bannerMain.textContent = text;
  bannerSub.textContent = sub;
  banner.style.transition = 'none';
  banner.style.opacity = '0';
  banner.style.transform = 'translate(-50%,-55%) scale(0.98)';
  // style variants
  if(style==='warning'){ banner.style.background = 'linear-gradient(180deg, rgba(40,30,10,0.85), rgba(0,0,0,0.6))'; }
  else if(style==='boss'){ banner.style.background = 'linear-gradient(180deg, rgba(60,10,10,0.9), rgba(0,0,0,0.6))'; }
  else { banner.style.background = 'var(--banner-bg)'; }
  requestAnimationFrame(()=> {
    banner.style.transition = 'opacity 220ms ease, transform 220ms cubic-bezier(.2,.9,.2,1)';
    banner.style.opacity = '1';
    banner.style.transform = 'translate(-50%,-50%) scale(1)';
  });
  state.bannerTimeout = setTimeout(()=> {
    banner.style.opacity = '0';
    banner.style.transform = 'translate(-50%,-45%) scale(0.98)';
  }, duration);
}

/* -------------------------
   Entities: enemies, boss, projectiles
   ------------------------- */
class Enemy {
  constructor(x,y,def){
    this.x = x; this.y = y; this.def = def;
    this.hp = def.hp; this.speed = def.speed; this.color = def.color; this.type = def.type;
    this.radius = 18;
  }
  update(dt){
    this.y += this.speed * dt;
  }
  draw(ctx){
    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.fillStyle = this.color;
    if(this.type==='circle'){ ctx.beginPath(); ctx.arc(0,0,this.radius,0,Math.PI*2); ctx.fill(); }
    else if(this.type==='triangle'){ ctx.beginPath(); ctx.moveTo(0,-this.radius); ctx.lineTo(this.radius, this.radius); ctx.lineTo(-this.radius,this.radius); ctx.closePath(); ctx.fill(); }
    else if(this.type==='diamond'){ ctx.beginPath(); ctx.moveTo(0,-this.radius); ctx.lineTo(this.radius,0); ctx.lineTo(0,this.radius); ctx.lineTo(-this.radius,0); ctx.closePath(); ctx.fill(); }
    else if(this.type==='hex'){ for(let i=0;i<6;i++){ ctx.rotate(Math.PI/3); ctx.fillRect(-this.radius/2,-this.radius, this.radius, this.radius/2); } }
    ctx.restore();
  }
}

class Projectile {
  constructor(x,y,vy= -420){ this.x=x; this.y=y; this.vy=vy; this.radius=6; this.color='#fff'; }
  update(dt){ this.y += this.vy*dt; }
  draw(ctx){ ctx.fillStyle=this.color; ctx.beginPath(); ctx.arc(this.x,this.y,this.radius,0,Math.PI*2); ctx.fill(); }
}

class Boss {
  constructor(x,y){
    this.x=x; this.y=y; this.maxHP=300; this.hp=this.maxHP; this.radius=80; this.baseColor='#ff6b6b';
    this.state='idle'; this.damageStage=0; this.flashTimer=0;
  }
  applyDamage(dmg){
    if(this.hp<=0) return;
    this.hp = Math.max(0,this.hp-dmg);
    this.flashTimer = 0.14;
    // update damage stage
    const pct = this.hp/this.maxHP;
    this.damageStage = pct>0.66?0:(pct>0.33?1:2);
    if(this.hp===0) this.die();
  }
  die(){
    this.state='dead';
    // explosion handled by game loop (spawn particles)
  }
  update(dt){
    if(this.flashTimer>0) this.flashTimer -= dt;
  }
  draw(ctx){
    ctx.save();
    ctx.translate(this.x,this.y);
    // base body
    let color = this.baseColor;
    if(this.damageStage===1) color = '#ffd166';
    if(this.damageStage===2) color = '#c084fc';
    // flash effect
    if(this.flashTimer>0) color = '#ffffff';
    // body
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.ellipse(0,0,this.radius,this.radius*0.7,0,0,Math.PI*2); ctx.fill();
    // eyes / details
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(-30,-10,12,0,Math.PI*2); ctx.arc(30,-10,12,0,Math.PI*2); ctx.fill();
    // health bar above
    const barW = 220, barH=12;
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(-barW/2, -this.radius-28, barW, barH);
    ctx.fillStyle = '#2dd4bf'; ctx.fillRect(-barW/2, -this.radius-28, barW*(this.hp/this.maxHP), barH);
    ctx.restore();
  }
}

/* -------------------------
   Game loop and flow controller
   ------------------------- */
function resetState(){
  state.running=false; state.preCounting=false; state.timer=CONFIG.mainTimer; state.phaseIndex=0; state.zoneIndex=0;
  state.boss=null; state.enemies=[]; state.projectiles=[]; state.lastSpawn=0; state.lastTime=performance.now();
  updateHUD();
  showTimer();
  clearTimeout(state.bannerTimeout);
  banner.style.opacity='0';
}

function startSequence(){
  if(state.running) return;
  state.preCounting = true;
  showBanner('Prepare for hyperspace','Get ready', CONFIG.preCountdown*1000, 'warning');
  // pre-countdown visual numeric
  let t = CONFIG.preCountdown;
  const tick = setInterval(()=> {
    t--;
    if(t<=0){ clearInterval(tick); state.preCounting=false; state.running=true; state.lastTime=performance.now(); showTimer(); }
    else { bannerSub.textContent = `Starting in ${t}...`; }
  },1000);
  // after preCountdown, start main timer automatically (handled by loop)
}

/* Phase/hyperspace handling */
function enterZone(index){
  state.zoneIndex = clamp(index,0,CONFIG.enemyPools.length-1);
  // change background palette quickly (canvas overlay)
  canvas.style.background = CONFIG.zoneBackgrounds[state.zoneIndex] || canvas.style.background;
  zonePill.textContent = `Zone ${state.zoneIndex+1}`;
  // small flash
  flashScreen(CONFIG.zonePalettes[state.zoneIndex] || '#ffffff');
}

function flashScreen(color){
  const overlay = document.createElement('div');
  overlay.style.position='absolute'; overlay.style.left=0; overlay.style.top=0; overlay.style.width='100%'; overlay.style.height='100%';
  overlay.style.pointerEvents='none'; overlay.style.background = color; overlay.style.opacity='0.08'; overlay.style.transition='opacity 400ms';
  document.querySelector('.stage').appendChild(overlay);
  setTimeout(()=> overlay.style.opacity='0', 60);
  setTimeout(()=> overlay.remove(), 500);
}

function doHyperspace(nextZone, phaseNumber){
  // Announcement: prepare, hyperspace animation, load zone, begin phase
  showBanner('Prepare for hyperspace', '', 1000, 'warning');
  setTimeout(()=> {
    // hyperspace animation: zoom + star streaks
    hyperspaceAnimation().then(()=> {
      enterZone(nextZone);
      showBanner(`Begin Phase ${phaseNumber+1}`, '', 1000, 'phase');
      state.phaseIndex = phaseNumber;
      updateHUD();
    });
  }, 700);
}

/* Hyperspace animation (simple camera zoom + star streaks) */
function hyperspaceAnimation(){
  return new Promise(resolve=>{
    const duration = 900;
    const start = performance.now();
    const origW = canvas.width, origH = canvas.height;
    // create star overlay
    const stars = [];
    for(let i=0;i<60;i++) stars.push({x:rand(0,canvas.width), y:rand(0,canvas.height), l:rand(0.2,0.9)});
    function step(now){
      const t = (now-start)/duration;
      // draw overlay frame
      ctx.save();
      ctx.clearRect(0,0,canvas.width,canvas.height);
      // background dim
      ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0,0,canvas.width,canvas.height);
      // star streaks
      ctx.globalCompositeOperation = 'lighter';
      for(const s of stars){
        ctx.fillStyle = `rgba(255,255,255,${s.l*(1-t)})`;
        ctx.fillRect(s.x + (t*200), s.y, 2, 2);
      }
      ctx.globalCompositeOperation = 'source-over';
      ctx.restore();
      if(t<1) requestAnimationFrame(step);
      else resolve();
    }
    requestAnimationFrame(step);
  });
}

/* Spawn enemies based on current zone pool */
function spawnEnemy(){
  const pool = CONFIG.enemyPools[state.zoneIndex] || [];
  if(pool.length===0) return;
  const def = pool[Math.floor(Math.random()*pool.length)];
  const x = rand(80, canvas.width-80);
  const y = -40;
  state.enemies.push(new Enemy(x,y,def));
}

/* Spawn boss */
function spawnBoss(){
  state.boss = new Boss(canvas.width/2, canvas.height*0.28);
  showBanner('BOSS INCOMING','Brace yourself', 1200, 'boss');
  // small intro animation: scale in
  // handled visually by drawing and flash
}

/* Player: simple auto-fire from bottom center for demo */
function playerFire(){
  const px = canvas.width/2, py = canvas.height - 80;
  state.projectiles.push(new Projectile(px,py,-520));
}

/* Collision helpers */
function circleHit(ax,ay,ar,bx,by,br){ const dx=ax-bx, dy=ay-by; return dx*dx+dy*dy <= (ar+br)*(ar+br); }

/* Update HUD */
function updateHUD(){
  phasePill.textContent = `Phase ${state.phaseIndex+1}`;
  zonePill.textContent = `Zone ${state.zoneIndex+1}`;
}

/* Show timer DOM */
function showTimer(){
  timerEl.textContent = formatTime(state.timer);
  // color changes
  if(state.timer <= 10) timerEl.style.color = getComputedStyle(document.documentElement).getPropertyValue('--danger');
  else if(state.timer <= 30) timerEl.style.color = getComputedStyle(document.documentElement).getPropertyValue('--warn');
  else timerEl.style.color = getComputedStyle(document.documentElement).getPropertyValue('--ui');
}

/* -------------------------
   Main animation loop
   ------------------------- */
function gameLoop(now){
  if(!state.running && !state.preCounting){ requestAnimationFrame(gameLoop); return; }
  const dt = Math.min(0.05, (now - state.lastTime)/1000);
  state.lastTime = now;

  // Timer handling
  if(state.running){
    state.timer -= dt;
    // phase boundaries every 30s: compute next boundary times
    const boundaries = [90,60,30]; // times remaining when hyperspace should occur
    for(let i=0;i<boundaries.length;i++){
      const b = boundaries[i];
      // trigger when crossing below boundary and phaseIndex equals i
      if(state.timer <= b && state.phaseIndex === i){
        // hyperspace to next zone
        const nextZone = clamp(state.zoneIndex+1,0,CONFIG.enemyPools.length-1);
        doHyperspace(nextZone, i+1);
      }
    }
    // boss spawn when entering final 30s (phaseIndex >=3 or timer <=30)
    if(state.timer <= 30 && !state.boss){
      spawnBoss();
    }
    if(state.timer <= 0){
      state.running = false;
      showBanner('Time Up','Round Over', 2000, 'warning');
    }
  }

  // Spawning logic
  if(state.running && !state.boss){
    const spawnRate = CONFIG.spawnBaseRate * (1 + state.zoneIndex*0.2);
    if(now - state.lastSpawn > 1000 / spawnRate){
      spawnEnemy();
      state.lastSpawn = now;
    }
  }

  // Auto-fire player for demo
  if(state.running && Math.random() < 0.06) playerFire();

  // Update entities
  for(const e of state.enemies) e.update(dt);
  for(const p of state.projectiles) p.update(dt);
  if(state.boss) state.boss.update(dt);

  // Collisions: projectiles -> enemies
  for(let i=state.projectiles.length-1;i>=0;i--){
    const p = state.projectiles[i];
    // check enemies
    let removed=false;
    for(let j=state.enemies.length-1;j>=0;j--){
      const en = state.enemies[j];
      if(circleHit(p.x,p.y,p.radius,en.x,en.y,en.radius)){
        en.hp -= 8;
        state.projectiles.splice(i,1);
        removed=true;
        if(en.hp <= 0) state.enemies.splice(j,1);
        break;
      }
    }
    if(removed) continue;
    // check boss
    if(state.boss && circleHit(p.x,p.y,p.radius,state.boss.x,state.boss.y,state.boss.radius)){
      state.boss.applyDamage(12);
      state.projectiles.splice(i,1);
    }
  }

  // Remove off-screen
  state.enemies = state.enemies.filter(e=> e.y < canvas.height + 60);
  state.projectiles = state.projectiles.filter(p=> p.y > -40);

  // Drawing
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // background gradient per zone
  const bg = CONFIG.zoneBackgrounds[state.zoneIndex] || '#071026';
  const g = ctx.createLinearGradient(0,0,0,canvas.height);
  g.addColorStop(0, bg); g.addColorStop(1, '#000814');
  ctx.fillStyle = g; ctx.fillRect(0,0,canvas.width,canvas.height);

  // draw enemies
  for(const e of state.enemies) e.draw(ctx);

  // draw boss if present
  if(state.boss){
    state.boss.draw(ctx);
    // if boss dead, explosion particles and remove after short time
    if(state.boss.state==='dead'){
      // spawn explosion particles
      for(let i=0;i<30;i++){
        // simple particle effect: draw once
        ctx.fillStyle = `rgba(255,${Math.floor(rand(80,200))},0,${Math.random()})`;
        ctx.beginPath(); ctx.arc(state.boss.x + rand(-60,60), state.boss.y + rand(-40,40), rand(4,12),0,Math.PI*2); ctx.fill();
      }
      // clear boss after visual
      state.boss = null;
      showBanner('Boss Defeated','Great job', 1400, 'phase');
    }
  }

  // draw projectiles
  for(const p of state.projectiles) p.draw(ctx);

  // HUD updates
  showTimer();
  updateHUD();

  // Debug overlay
  if(state.debug){
    debugEl.style.display='block';
    debugEl.textContent = `Timer:${state.timer.toFixed(1)}\nPhase:${state.phaseIndex+1}\nZone:${state.zoneIndex+1}\nEnemies:${state.enemies.length}\nBoss:${state.boss?Math.round(state.boss.hp):'N/A'}`;
  } else debugEl.style.display='none';

  requestAnimationFrame(gameLoop);
}

/* -------------------------
   Controls wiring
   ------------------------- */
startBtn.addEventListener('click', ()=>{
  if(!state.running && !state.preCounting){
    startSequence();
    startBtn.textContent = 'Running';
    startBtn.disabled = true;
  }
});

resetBtn.addEventListener('click', ()=>{
  resetState();
  startBtn.textContent = 'Start';
  startBtn.disabled = false;
});

debugBtn.addEventListener('click', ()=>{
  state.debug = !state.debug;
  debugBtn.textContent = state.debug ? 'Debug On' : 'Toggle Debug';
});

/* Keyboard: space to fire (manual) */
window.addEventListener('keydown', (e)=>{
  if(e.code==='Space'){ playerFire(); e.preventDefault(); }
});

/* Initialize */
resetState();
enterZone(0);
updateHUD();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
